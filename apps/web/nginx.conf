server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # NB: no COOP/COEP here on purpose. Cornerstone3D runs without SharedArrayBuffer
  # and cross-origin isolation would otherwise block DICOMweb fetches from the API.
}
